# Static file server for the Cloud 9 run galleries on akvaithi.page.
# Public at photos.akvaithi.page via the cloudflare-tunnel container
# (route: http://172.17.0.1:8093). Files: /DATA/AppData/cloud9-photos.
name: cloud9-photos
services:
  cloud9-photos:
    image: nginx:1.27-alpine
    container_name: cloud9-photos
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8093:80"
    volumes:
      - /DATA/AppData/cloud9-photos:/srv/photos:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
