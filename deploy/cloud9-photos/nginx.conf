server {
    listen 80;
    root /srv/photos;
    autoindex off;
    server_tokens off;

    # Gallery images: thumbnails + 2400px web versions. Never change once written.
    location ~ ^/([a-z0-9-]+)/web/([A-Za-z0-9_.-]+\.webp)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Full-resolution original, forced to download under a readable name.
    location ~ ^/dl/([a-z0-9-]+)/([A-Za-z0-9_-]+)\.jpg$ {
        alias /srv/photos/$1/$2.jpg;
        add_header Content-Disposition 'attachment; filename="Cloud9-$1-$2.jpg"' always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Whole run as one zip.
    location ~ ^/dl/([a-z0-9-]+)\.zip$ {
        alias /srv/photos/zips/Cloud9-$1.zip;
        add_header Content-Disposition 'attachment; filename="Cloud9-$1.zip"' always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
